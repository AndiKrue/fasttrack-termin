# docker compose up --build   ->  app on http://127.0.0.1:8765, public HTTPS via a Cloudflare quick
# tunnel, Telegram bot that finds the tunnel URL itself and sets the mini app menu button.
# Secrets come from the git-ignored .env only.
x-common: &common
  build: .
  env_file: .env
  environment:
    ZETARIS_JDBC_URL: jdbc:zetaris:lightning@host.docker.internal:10000
    ZETARIS_JDBC_JAR: ${ZETARIS_JDBC_JAR:+/zetaris/jdbc}
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes:
    - ./runs:/app/runs
    - ${ZETARIS_JDBC_DIR:-./zetaris/jdbc}:/zetaris/jdbc:ro
  restart: unless-stopped

services:
  app:
    <<: *common
    ports: ["127.0.0.1:8765:8765"]

  tunnel:
    image: cloudflare/cloudflared:2026.10.5
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://app:8765
    depends_on: [app]
    restart: unless-stopped

  bot:
    <<: *common
    command: ["python", "-m", "fasttrack.telegram_bot"]
    environment:
      ZETARIS_JDBC_URL: jdbc:zetaris:lightning@host.docker.internal:10000
      ZETARIS_JDBC_JAR: ${ZETARIS_JDBC_JAR:+/zetaris/jdbc}
      FT_TUNNEL_METRICS: http://tunnel:20241
    depends_on: [tunnel]
